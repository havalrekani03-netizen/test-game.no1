<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#28124d">
<title>تحدّي النجوم</title>
<style>
:root{--pink:#ff4f9a;--purple:#28124d;--gold:#ffd75e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#6539a0 0,#28124d 56%,#130a26 100%);display:flex;align-items:center;justify-content:center}
#starsBg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.twinkle{position:absolute;color:#fff;opacity:.6;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.65)}}
.panel{position:relative;width:min(92vw,510px);padding:25px 19px 22px;text-align:center;border-radius:28px;background:#ffffff12;border:1px solid #ffffff2a;box-shadow:0 18px 60px #0005;backdrop-filter:blur(10px)}
.tag{font-size:.8rem;letter-spacing:2px;color:#f7c8e2}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.15;margin:12px 0;color:#fff}
p{line-height:1.8;color:#f1e5ff;margin:12px 0 18px}
button{border:0;border-radius:999px;padding:13px 24px;font-size:1.05rem;font-weight:800;cursor:pointer;color:#35103f;background:linear-gradient(135deg,#ffe27a,#ff7eb4);box-shadow:0 8px 24px #ff5fa244}
button:active{transform:scale(.97)}
#game{display:none}
.stats{display:flex;justify-content:center;gap:10px;margin:16px 0}
.badge{background:#ffffff18;border:1px solid #ffffff25;border-radius:999px;padding:8px 15px}
#arena{height:min(48vh,310px);min-height:230px;position:relative;border-radius:20px;overflow:hidden;border:1px solid #ffffff30;background:linear-gradient(#3b7fdd66,#2a165c88),radial-gradient(circle at 30% 20%,#5fc9ff55,transparent 40%)}
.target{position:absolute;width:57px;height:57px;display:grid;place-items:center;border-radius:50%;font-size:2.2rem;background:#fff1;border:1px solid #fff6;box-shadow:0 0 25px #ffd75e66;cursor:pointer;user-select:none;touch-action:manipulation;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.note{font-size:.9rem;color:#d9c8f6;margin-bottom:0}
#reveal{display:none;position:fixed;inset:0;z-index:10;background:linear-gradient(135deg,#ffc8df,#ff9fce,#ffe1ee,#ffacd5);background-size:300% 300%;animation:pinkGlow 6s ease-in-out infinite;align-items:center;justify-content:center;padding:12px;overflow:auto}
#birthdayImage{display:block;width:min(100%,850px);max-height:96vh;object-fit:contain;border-radius:16px;box-shadow:0 12px 45px #9c2e6570;animation:pictureArrive 1.1s cubic-bezier(.2,.9,.25,1.2) both, pictureFloat 3.2s ease-in-out 1.1s infinite;transform-origin:center}
@keyframes pictureArrive{0%{opacity:0;transform:scale(.35) rotate(-7deg)}70%{opacity:1;transform:scale(1.04) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pictureFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.012)}}
@keyframes pinkGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#replay{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:12;display:none;white-space:nowrap;padding:10px 18px;font-size:.9rem}
.confetti{position:fixed;top:-18px;width:9px;height:14px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
</style>
</head>
<body>
<div id="starsBg"></div>
<main class="panel" id="intro">
 <div class="tag">مهمّة سرّية ✨</div>
 <h1>تحدّي النجوم ⭐</h1>
 <p>هل تستطيع جمع 5 نجوم؟<br>لديك 30 ثانية — هيا نبدأ! 🎮</p>
 <button id="start">ابدأ اللعب 🎮</button>
</main>
<main class="panel" id="game">
 <div class="tag">اجمع النجوم وافتح المفاجأة</div>
 <div class="stats"><div class="badge">⭐ النقاط: <b id="score">0</b> / 5</div><div class="badge">⏱️ الوقت: <b id="time">30</b></div></div>
 <div id="arena" aria-label="منطقة جمع النجوم"></div>
 <p class="note">اضغط على النجمة كلما ظهرت ⭐💫</p>
</main>
<section id="reveal" aria-label="مفاجأة عيد الميلاد">
 <img id="birthdayImage" alt="Happy Birthday — مفاجأة عيد الميلاد مع فتيات القوة">
</section>
<button id="replay">العب مرة أخرى ↻</button>
<script>
const $=id=>document.getElementById(id);
const bg=$("starsBg");
for(let i=0;i<45;i++){let s=document.createElement("span");s.className="twinkle";s.textContent=["✦","✧","·"][i%3];s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.fontSize=(10+Math.random()*18)+"px";s.style.animationDelay=Math.random()*2+"s";bg.appendChild(s)}
let score=0,time=30,timer=null,spawnTimer=null,finished=false;
let birthdayAudio=null, birthdaySongTimers=[];
function stopBirthdaySong(){
  birthdaySongTimers.forEach(id=>clearTimeout(id));birthdaySongTimers=[];
  if(birthdayAudio){try{birthdayAudio.close()}catch(e){} birthdayAudio=null;}
}
function playBirthdaySong(){
  stopBirthdaySong();
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  birthdayAudio=new AudioCtx();
  const ctx=birthdayAudio;
  if(ctx.state==='suspended') ctx.resume();
  // Bright, fast party-style Happy Birthday melody with a bouncy bass and claps.
  const beat=0.22; // about 136 beats per minute
  const N={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  const melody=[
    ['G4',1],['G4',1],['A4',2],['G4',2],['C5',2],['B4',3],
    ['G4',1],['G4',1],['A4',2],['G4',2],['D5',2],['C5',3],
    ['G4',1],['G4',1],['G5',2],['E5',2],['C5',2],['B4',2],['A4',3],
    ['F5',1],['F5',1],['E5',2],['C5',2],['D5',2],['C5',4]
  ];
  // Add a few bright upper notes to complete the last phrase.
  melody[melody.length-6][0]='F5';
  function tone(freq, start, duration, type, volume){
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,start);
    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(volume,start+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(start);osc.stop(start+duration+0.015);
  }
  function kick(start){
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(135,start);osc.frequency.exponentialRampToValueAtTime(48,start+0.11);
    gain.gain.setValueAtTime(0.0001,start);gain.gain.exponentialRampToValueAtTime(0.22,start+0.008);gain.gain.exponentialRampToValueAtTime(0.0001,start+0.13);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+0.14);
  }
  function clap(start){
    const length=Math.floor(ctx.sampleRate*0.055), buffer=ctx.createBuffer(1,length,ctx.sampleRate), data=buffer.getChannelData(0);
    for(let i=0;i<length;i++) data[i]=(Math.random()*2-1)*(1-i/length);
    const noise=ctx.createBufferSource(), filter=ctx.createBiquadFilter(), gain=ctx.createGain();
    noise.buffer=buffer;filter.type='highpass';filter.frequency.value=1200;
    gain.gain.setValueAtTime(0.0001,start);gain.gain.exponentialRampToValueAtTime(0.11,start+0.004);gain.gain.exponentialRampToValueAtTime(0.0001,start+0.06);
    noise.connect(filter);filter.connect(gain);gain.connect(ctx.destination);noise.start(start);noise.stop(start+0.06);
  }
  let at=ctx.currentTime+0.08;
  melody.forEach(([name,beats],i)=>{
    const duration=beat*beats*0.82, freq=N[name]||N.E5;
    tone(freq,at,duration,'square',0.075);
    tone(freq*2,at,duration*0.55,'triangle',0.022);
    // Steady party beat underneath the melody.
    for(let j=0;j<beats;j++){
      const t=at+j*beat;
      if((i+j)%2===0) kick(t);
      if((i+j)%4===2) clap(t);
    }
    at+=beat*beats;
  });
  // A cheerful little sparkle at the end.
  [N.C5,N.E5,N.G5,N.C5*2].forEach((f,i)=>tone(f,at+i*beat*0.6,beat*1.1,'triangle',0.055));
}
function spawn(){
 if(finished)return;
 const a=$("arena");a.querySelectorAll(".target").forEach(x=>x.remove());
 const t=document.createElement("button");t.className="target";t.textContent=["⭐","🌟","✨"][Math.floor(Math.random()*3)];t.setAttribute("aria-label","اجمع النجمة");
 t.style.left=Math.max(4,Math.random()*(a.clientWidth-62))+"px";t.style.top=Math.max(4,Math.random()*(a.clientHeight-62))+"px";
 t.onclick=()=>{if(finished)return;score++;$("score").textContent=score;if(score>=5){win();return}spawn()};
 a.appendChild(t);clearTimeout(spawnTimer);spawnTimer=setTimeout(spawn,1250);
}
function start(){
 clearInterval(timer);clearTimeout(spawnTimer);score=0;time=30;finished=false;
 $("score").textContent=score;$("time").textContent=time;$("intro").style.display="none";$("game").style.display="block";$("reveal").style.display="none";$("replay").style.display="none";
 spawn();timer=setInterval(()=>{time--;$("time").textContent=time;if(time<=0){clearInterval(timer);finished=true;$("arena").innerHTML='<div style="padding:75px 10px;color:white">انتهى الوقت! حاول مرة أخرى 😊</div>';$("replay").style.display="block"}},1000);
}
function win(){
 playBirthdaySong();finished=true;clearInterval(timer);clearTimeout(spawnTimer);$("game").style.display="none";$("reveal").style.display="flex";$("replay").style.display="block";confetti();
}
function confetti(){const colors=["#ff4f9a","#ffd75e","#8b5cf6","#7ee8fa","#fff"];for(let i=0;i<110;i++){let c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];c.style.borderRadius=Math.random()>.5?"50%":"2px";c.style.animationDuration=(2.3+Math.random()*3)+"s";c.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),6000)}}
$("start").onclick=start;
$("replay").onclick=()=>{stopBirthdaySong();clearInterval(timer);clearTimeout(spawnTimer);$("reveal").style.display="none";$("game").style.display="none";$("intro").style.display="block";$("replay").style.display="none";$("arena").innerHTML=""};
